name: Deploy PlatePilgrim to AWS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-infra:
    name: CDK deploy infra
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.cdk.outputs.bucket }}
      distribution_id: ${{ steps.cdk.outputs.distribution_id }}
      api_endpoint: ${{ steps.cdk.outputs.api_endpoint }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Install infra deps
        run: npm ci
        working-directory: infra

      - name: CDK bootstrap (idempotent)
        run: npx cdk bootstrap
        working-directory: infra

      - name: CDK deploy
        id: cdk
        run: |
          OUTPUT=$(npx cdk deploy --require-approval never --outputs-file cdk-outputs.json 2>&1)
          echo "$OUTPUT"
          BUCKET=$(node -e "const o=require('./cdk-outputs.json'); console.log(o.PlatePilgrimStack.FrontendBucketName)")
          DIST_ID=$(node -e "const o=require('./cdk-outputs.json'); console.log(o.PlatePilgrimStack.CloudFrontDistributionId)")
          API=$(node -e "const o=require('./cdk-outputs.json'); console.log(o.PlatePilgrimStack.ApiEndpoint)")
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT
          echo "api_endpoint=$API" >> $GITHUB_OUTPUT
        working-directory: infra

  deploy-frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    needs: deploy-infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Write .env.production
        run: |
          cat > .env.production <<EOF
          VITE_COGNITO_DOMAIN=${{ secrets.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID=${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_API_URL=
          EOF
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ needs.deploy-infra.outputs.bucket }}" \
            --delete \
            --cache-control "max-age=60"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.deploy-infra.outputs.distribution_id }}" \
            --paths "/*"
